[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "girachave"
version = "1.0.0"
description = "Diagnóstico, rotação e evidências de auditoria para identidades não nominais do Microsoft Entra ID"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # somente biblioteca padrão: superfície de supply chain mínima
keywords = ["entra-id", "azure-ad", "iam", "nhi", "security", "compliance", "lgpd", "iso27001"]

[project.scripts]
girachave = "girachave.cli:main"

[tool.setuptools.packages.find]
include = ["girachave*"]
